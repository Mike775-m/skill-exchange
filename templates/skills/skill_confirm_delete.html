{% extends 'base.html' %}
{% block title %}Delete Skill &mdash; Community Skill Exchange{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="surface-card text-center">
                <i class="bi bi-exclamation-triangle text-danger fs-1 mb-3 d-block"></i>
                <h3 class="fw-heading">Delete "{{ object.title }}"?</h3>
                <p class="text-muted">This action cannot be undone. The listing will be permanently removed.</p>
                <form method="post" class="d-flex justify-content-center gap-2 mt-4">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i>Yes, Delete</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
